<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Список задач и входящие</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f0; min-height: 100vh; padding: 40px 24px; }
  .page { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }

  .section-label { font-size: 12px; font-weight: 600; color: #888; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }

  .card { background: #fff; border: 1px solid #e5e5e0; border-radius: 14px; overflow: hidden; }

  .card-header { padding: 14px 20px; border-bottom: 1px solid #efefea; display: flex; align-items: center; gap: 12px; background: #fff; }
  .card-header-title { font-size: 15px; font-weight: 500; color: #1a1a1a; flex: 1; }

  .search-box { display: flex; align-items: center; gap: 8px; background: #f7f7f3; border: 1px solid #e5e5e0; border-radius: 8px; padding: 6px 12px; flex: 1; max-width: 260px; }
  .search-box input { border: none; background: none; font-size: 13px; color: #1a1a1a; outline: none; width: 100%; }
  .search-box input::placeholder { color: #bbb; }

  .filter-btns { display: flex; gap: 6px; }
  .filter-btn { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 20px; border: 1px solid #e5e5e0; background: #fff; color: #666; cursor: pointer; transition: all .15s; font-family: inherit; }
  .filter-btn:hover { border-color: #bbb; color: #333; }
  .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  .badge-count { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 10px; }
  .bc-red   { background: #FCEBEB; color: #A32D2D; }
  .bc-blue  { background: #E6F1FB; color: #0C447C; }
  .bc-gray  { background: #f1f1ec; color: #666; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th { font-size: 11px; font-weight: 600; color: #aaa; letter-spacing: .04em; text-transform: uppercase; padding: 10px 16px; text-align: left; border-bottom: 1px solid #efefea; background: #fafaf8; cursor: pointer; user-select: none; white-space: nowrap; }
  thead th:hover { color: #555; }
  thead th .sort-arrow { margin-left: 4px; opacity: .4; }
  thead th.sorted .sort-arrow { opacity: 1; color: #378ADD; }
  th:nth-child(1) { width: 36%; }
  th:nth-child(2) { width: 18%; }
  th:nth-child(3) { width: 14%; }
  th:nth-child(4) { width: 16%; }
  th:nth-child(5) { width: 16%; }

  tbody tr { border-bottom: 1px solid #f5f5f0; cursor: pointer; transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafaf8; }
  tbody tr.overdue { background: #fff8f8; }
  tbody tr.overdue:hover { background: #fef2f2; }

  td { padding: 11px 16px; font-size: 13px; color: #1a1a1a; vertical-align: middle; }
  td.overdue-date { color: #E24B4A; font-weight: 500; }
  td.normal-date  { color: #3B6D11; }
  td.warn-date    { color: #BA7517; }

  .task-name-cell { display: flex; align-items: center; gap: 8px; }
  .avatar-sm { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; flex-shrink: 0; }
  .task-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .overdue-row-label { font-size: 10px; background: #FCEBEB; color: #A32D2D; padding: 1px 6px; border-radius: 4px; font-weight: 600; flex-shrink: 0; }

  .prio-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .status-pill { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 10px; display: inline-block; }
  .s-new    { background: #E6F1FB; color: #185FA5; }
  .s-work   { background: #EAF3DE; color: #27500A; }
  .s-wait   { background: #FAEEDA; color: #633806; }
  .s-review { background: #EEEDFE; color: #3C3489; }

  .col-sort-indicator { display: inline; }

  .inbox-list { display: flex; flex-direction: column; }
  .inbox-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #f5f5f0; cursor: pointer; transition: background .1s; position: relative; }
  .inbox-item:last-child { border-bottom: none; }
  .inbox-item:hover { background: #fafaf8; }
  .inbox-item.unread { background: #fdfcff; }
  .inbox-item.unread:hover { background: #f7f5ff; }
  .unread-dot { width: 7px; height: 7px; border-radius: 50%; background: #378ADD; flex-shrink: 0; margin-top: 6px; }
  .read-dot   { width: 7px; height: 7px; flex-shrink: 0; margin-top: 6px; }
  .inbox-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .inbox-body { flex: 1; min-width: 0; }
  .inbox-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .inbox-from { font-size: 13px; font-weight: 500; color: #1a1a1a; }
  .inbox-time { font-size: 12px; color: #bbb; margin-left: auto; flex-shrink: 0; }
  .inbox-subject { font-size: 13px; color: #1a1a1a; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inbox-subject.unread-text { font-weight: 500; }
  .inbox-preview { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inbox-tags { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
  .inbox-tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; font-weight: 500; }
  .it-red   { background: #FCEBEB; color: #A32D2D; }
  .it-amber { background: #FAEEDA; color: #633806; }
  .it-blue  { background: #E6F1FB; color: #185FA5; }
  .it-green { background: #EAF3DE; color: #27500A; }
  .it-gray  { background: #f1f1ec; color: #555; }

  .mark-read-btn { font-size: 12px; color: #aaa; background: none; border: none; cursor: pointer; padding: 3px 8px; border-radius: 6px; font-family: inherit; flex-shrink: 0; margin-top: 2px; }
  .mark-read-btn:hover { background: #f0f0ea; color: #555; }
  .unread-count { font-size: 12px; color: #666; }

  .empty-state { text-align: center; padding: 32px; color: #bbb; font-size: 14px; display: none; }
  .empty-state svg { display: block; margin: 0 auto 10px; opacity: .3; }
</style>
</head>
<body>
<div class="page">

  <!-- СПИСОК ЗАДАЧ -->
  <div>
    <div class="section-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Мои задачи
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-header-title">Список задач</span>
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Поиск по теме..." oninput="searchTasks(this.value)">
        </div>
        <div class="filter-btns">
          <button class="filter-btn active" onclick="setFilter('all',this)">Все</button>
          <button class="filter-btn" onclick="setFilter('overdue',this)">
            Просроченные <span class="badge-count bc-red" style="margin-left:2px">3</span>
          </button>
          <button class="filter-btn" onclick="setFilter('work',this)">В работе</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="tasks-table">
          <thead>
            <tr>
              <th onclick="sortTable(0)">Тема <span class="sort-arrow col-sort-indicator">↕</span></th>
              <th onclick="sortTable(1)">Инициатор <span class="sort-arrow col-sort-indicator">↕</span></th>
              <th onclick="sortTable(2)" class="sorted">Срок <span class="sort-arrow col-sort-indicator">↑</span></th>
              <th onclick="sortTable(3)">Приоритет <span class="sort-arrow col-sort-indicator">↕</span></th>
              <th onclick="sortTable(4)">Статус <span class="sort-arrow col-sort-indicator">↕</span></th>
            </tr>
          </thead>
          <tbody id="tasks-body"></tbody>
        </table>
        <div class="empty-state" id="tasks-empty">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Задачи не найдены
        </div>
      </div>
    </div>
  </div>

  <!-- ВХОДЯЩИЕ -->
  <div>
    <div class="section-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      Входящие
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-header-title">Непросмотренные задачи</span>
        <span class="unread-count" id="unread-count">7 непросмотренных</span>
        <button class="filter-btn" onclick="markAllRead()" style="margin-left:8px">Прочитать все</button>
      </div>
      <div class="inbox-list" id="inbox-list"></div>
    </div>
  </div>

</div>

<script>
const tasks = [
  { name:'Обновить конфигурацию модуля отчётности', person:'Иванов А.С.', date:'2026-05-23', prio:'high',   status:'work',   overdue:true,  av:'ИА', avc:'#FCEBEB', avt:'#A32D2D' },
  { name:'Миграция данных в АСДОБ',                 person:'Урсова Е.А.',  date:'2026-05-20', prio:'crit',   status:'work',   overdue:true,  av:'УЕ', avc:'#FCEBEB', avt:'#A32D2D' },
  { name:'Отчёт по инцидентам за май',              person:'Петрова О.С.', date:'2026-05-28', prio:'med',    status:'work',   overdue:true,  av:'ОП', avc:'#E1F5EE', avt:'#0F6E56' },
  { name:'Настройка канбан-доски',                  person:'Казакова Н.А.',date:'2026-06-03', prio:'high',   status:'work',   overdue:false, av:'КН', avc:'#E6F1FB', avt:'#185FA5' },
  { name:'Push-уведомления в 1С',                   person:'Орлов А.В.',   date:'2026-06-01', prio:'high',   status:'work',   overdue:false, av:'ОА', avc:'#FAEEDA', avt:'#633806' },
  { name:'Внедрение шаблона заявки',                person:'Дмитриев К.В.',date:'2026-06-07', prio:'med',    status:'work',   overdue:false, av:'ДК', avc:'#E6F1FB', avt:'#185FA5' },
  { name:'Разработка шаблона заявки',               person:'Иванов А.С.', date:'2026-06-10', prio:'low',    status:'new',    overdue:false, av:'ИА', avc:'#FCEBEB', avt:'#A32D2D' },
  { name:'Обновление ролевой модели',               person:'Казакова Н.А.',date:'2026-05-31', prio:'med',    status:'wait',   overdue:false, av:'КН', avc:'#E6F1FB', avt:'#185FA5' },
  { name:'Тестирование модуля уведомлений',         person:'Орлов А.В.',   date:'2026-06-05', prio:'med',    status:'review', overdue:false, av:'ОА', avc:'#FAEEDA', avt:'#633806' },
  { name:'Документирование API системы',            person:'Петрова О.С.', date:'2026-06-12', prio:'low',    status:'new',    overdue:false, av:'ОП', avc:'#E1F5EE', avt:'#0F6E56' },
];

const prioCfg = {
  crit: { color:'#E24B4A', label:'Критический' },
  high: { color:'#EF9F27', label:'Высокий' },
  med:  { color:'#EF9F27', label:'Средний' },
  low:  { color:'#B4B2A9', label:'Низкий' },
};
const statusCfg = {
  new:    { cls:'s-new',    label:'Новая' },
  work:   { cls:'s-work',   label:'В работе' },
  wait:   { cls:'s-wait',   label:'Ожидаю ответа' },
  review: { cls:'s-review', label:'На проверке' },
};

let currentFilter = 'all';
let searchQuery = '';
let sortCol = 2;
let sortAsc = true;

function renderTable() {
  let data = [...tasks];
  if (currentFilter === 'overdue') data = data.filter(t => t.overdue);
  if (currentFilter === 'work')    data = data.filter(t => t.status === 'work');
  if (searchQuery) data = data.filter(t => t.name.toLowerCase().includes(searchQuery.toLowerCase()));

  data.sort((a,b) => {
    let va, vb;
    if (sortCol === 0) { va = a.name; vb = b.name; }
    else if (sortCol === 1) { va = a.person; vb = b.person; }
    else if (sortCol === 2) { va = a.date; vb = b.date; }
    else if (sortCol === 3) { const o={crit:0,high:1,med:2,low:3}; va = o[a.prio]; vb = o[b.prio]; }
    else { va = a.status; vb = b.status; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('tasks-body');
  const empty = document.getElementById('tasks-empty');
  tbody.innerHTML = '';

  if (!data.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  data.forEach(t => {
    const p = prioCfg[t.prio];
    const s = statusCfg[t.status];
    const dateStr = t.date.split('-').reverse().join('.');
    const now = new Date('2026-05-30');
    const dDate = new Date(t.date);
    const diff = Math.round((dDate - now) / 86400000);
    let dateCls = 'normal-date';
    if (t.overdue) dateCls = 'overdue-date';
    else if (diff <= 2) dateCls = 'warn-date';

    const tr = document.createElement('tr');
    if (t.overdue) tr.classList.add('overdue');
    tr.innerHTML = `
      <td><div class="task-name-cell">
        <div class="avatar-sm" style="background:${t.avc};color:${t.avt}">${t.av}</div>
        <span class="task-name-text">${t.name}</span>
        ${t.overdue ? '<span class="overdue-row-label">просрочена</span>' : ''}
      </div></td>
      <td style="color:#666;font-size:13px">${t.person}</td>
      <td class="${dateCls}">${dateStr}</td>
      <td><span style="display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#444">
        <span class="prio-dot" style="background:${p.color}"></span>${p.label}
      </span></td>
      <td><span class="status-pill ${s.cls}">${s.label}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function searchTasks(q) {
  searchQuery = q;
  renderTable();
}

function sortTable(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  document.querySelectorAll('thead th').forEach((th,i) => {
    th.classList.toggle('sorted', i === col);
    const arr = th.querySelector('.sort-arrow');
    if (arr) arr.textContent = i === col ? (sortAsc ? '↑' : '↓') : '↕';
  });
  renderTable();
}

const inbox = [
  { from:'Иванов А.С.', av:'ИА', avc:'#FCEBEB', avt:'#A32D2D', subject:'Новая задача: Разработка шаблона заявки', preview:'Необходимо разработать обязательный шаблон для создания заявок в системе...', time:'10:14', tags:[{l:'Высокий',c:'it-amber'},{l:'Новая',c:'it-blue'}], unread:true },
  { from:'Петрова О.С.', av:'ОП', avc:'#E1F5EE', avt:'#0F6E56', subject:'Новая задача: Подготовка отчёта для руководства', preview:'Требуется подготовить сводный отчёт по задачам за май 2026 года...', time:'09:47', tags:[{l:'Средний',c:'it-gray'},{l:'Новая',c:'it-blue'}], unread:true },
  { from:'Казакова Н.А.', av:'КН', avc:'#E6F1FB', avt:'#185FA5', subject:'Новая задача: Тестирование статуса «Ожидаю ответа»', preview:'Протестировать корректность работы нового статуса в конфигурации...', time:'09:31', tags:[{l:'Средний',c:'it-gray'},{l:'Новая',c:'it-blue'}], unread:true },
  { from:'Орлов А.В.', av:'ОА', avc:'#FAEEDA', avt:'#633806', subject:'Новая задача: Обновление регламента доступа', preview:'Актуализировать регламент разграничения прав доступа в АСДОБ...', time:'вчера', tags:[{l:'Высокий',c:'it-amber'},{l:'Новая',c:'it-blue'}], unread:true },
  { from:'Дмитриев К.В.', av:'ДК', avc:'#E6F1FB', avt:'#185FA5', subject:'Новая задача: Анализ инцидентов за квартал', preview:'Собрать и проанализировать данные по инцидентам за Q2 2026...', time:'вчера', tags:[{l:'Низкий',c:'it-gray'},{l:'Новая',c:'it-blue'}], unread:true },
  { from:'Урсова Е.А.', av:'УЕ', avc:'#FCEBEB', avt:'#A32D2D', subject:'Новая задача: Согласование изменений в ТЗ', preview:'Требуется согласовать внесённые изменения в техническое задание...', time:'вчера', tags:[{l:'Критический',c:'it-red'},{l:'Новая',c:'it-blue'}], unread:true },
  { from:'Иванов А.С.', av:'ИА', avc:'#FCEBEB', avt:'#A32D2D', subject:'Новая задача: Перенос данных на новый сервер', preview:'Выполнить перенос и верификацию данных на новый сервер m-1c-03...', time:'27 мая', tags:[{l:'Высокий',c:'it-amber'},{l:'Новая',c:'it-blue'}], unread:true },
];

function renderInbox() {
  const list = document.getElementById('inbox-list');
  const countEl = document.getElementById('unread-count');
  list.innerHTML = '';
  const unreadCount = inbox.filter(i => i.unread).length;
  countEl.textContent = unreadCount > 0 ? `${unreadCount} непросмотренных` : 'Все прочитаны';

  inbox.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'inbox-item' + (item.unread ? ' unread' : '');
    div.innerHTML = `
      <div class="${item.unread ? 'unread-dot' : 'read-dot'}"></div>
      <div class="inbox-avatar" style="background:${item.avc};color:${item.avt}">${item.av}</div>
      <div class="inbox-body">
        <div class="inbox-top">
          <span class="inbox-from">${item.from}</span>
          <span class="inbox-time">${item.time}</span>
        </div>
        <div class="inbox-subject${item.unread ? ' unread-text' : ''}">${item.subject}</div>
        <div class="inbox-preview">${item.preview}</div>
        <div class="inbox-tags">${item.tags.map(t=>`<span class="inbox-tag ${t.c}">${t.l}</span>`).join('')}</div>
      </div>
      <button class="mark-read-btn" onclick="markRead(event,${idx})">${item.unread ? 'Прочитано' : '✓'}</button>
    `;
    div.addEventListener('click', (e) => { if (!e.target.closest('.mark-read-btn')) markRead(e, idx); });
    list.appendChild(div);
  });
}

function markRead(e, idx) {
  e.stopPropagation();
  inbox[idx].unread = false;
  renderInbox();
}

function markAllRead() {
  inbox.forEach(i => i.unread = false);
  renderInbox();
}

renderTable();
renderInbox();
</script>
</body>
</html>
